    <!--
      Pairs with public/404.html — see the detailed comment in that file.
      This script runs first, before React loads, and reverses the
      redirect encoding so the URL bar shows the real path (e.g.
      "/portfolio/experience") and React Router renders the right page.
      Do not remove this if you are hosting on GitHub Pages.
    -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
