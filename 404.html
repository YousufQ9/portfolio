<!doctype html>
<!--
  WHY THIS FILE EXISTS
  ----------------------------------------------------------------------------
  GitHub Pages only serves static files — it has no idea that "/experience"
  or "/projects" are valid routes inside our React app; those routes only
  exist in JavaScript, once React Router has loaded. So if someone visits
  yourusername.github.io/portfolio/experience directly (or refreshes the
  page while on it), GitHub Pages looks for a real file at that path, can't
  find one, and serves this 404.html file instead of a blank error page.

  This file's only job is to redirect that request back to index.html
  while preserving the original path, so React Router can take over and
  render the correct page once the app loads. This is a well-established
  technique for single-page apps on GitHub Pages — you do not need to
  understand every line, just leave this file as-is.

  You should NOT need to edit this file. It works automatically with the
  `base` path set in vite.config.js.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Encode the current path as a query string and redirect to the
      // site root, where index.html (and our SPA redirect-handling script)
      // will decode it and restore the correct URL via history.replaceState.
      var pathSegmentsToKeep = 1; // number of segments in the base path, e.g. "/portfolio" = 1
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
